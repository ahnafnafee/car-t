name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m constructs.verify_sources
      - run: python -m constructs.vector_reference
      - run: python constructs/build_car.py
      - run: git diff --exit-code -- constructs/
      - run: python simulator/run_sim.py --n 2
      - run: python simulator/abm_assay.py --hours 0.02 --tumor 8
